name: Deploy

on:
  push:
    branches: [main]

jobs:
  test-backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: blog_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      SECRET_KEY: ci-test-secret-key
      DEBUG: "True"
      DATABASE_NAME: blog_db
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      ALLOWED_HOSTS: localhost

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run migrations
        run: python manage.py migrate

      - name: Type check
        run: mypy blog/

      - name: Run tests
        run: python -m pytest -v

  test-frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npx vue-tsc --noEmit

      - name: Build
        working-directory: frontend
        run: npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]

    env:
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_django_secret_key: ${{ secrets.DJANGO_SECRET_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2

      # Package Lambda with Linux ARM64 binaries
      - name: Package Lambda
        run: bash scripts/package_lambda.sh

      # Deploy infrastructure
      - name: Terraform init
        working-directory: infra
        run: terraform init

      - name: Terraform apply
        working-directory: infra
        run: terraform apply -auto-approve

      # Run migrations on RDS via Lambda
      - name: Run migrations
        run: |
          aws lambda invoke \
            --function-name django-serverless-blog-api \
            --cli-binary-format raw-in-base64-out \
            --payload '{"manage":"migrate"}' \
            --region eu-west-2 \
            /tmp/migrate-out.json
          cat /tmp/migrate-out.json

      # Build and deploy frontend
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Deploy frontend to S3
        run: |
          BUCKET=$(cd infra && terraform output -raw s3_bucket_name)
          aws s3 sync frontend/dist "s3://$BUCKET" --delete

      - name: Invalidate CloudFront cache
        run: |
          DOMAIN=$(cd infra && terraform output -raw cloudfront_domain)
          DIST_ID=$(aws cloudfront list-distributions --query "DistributionList.Items[?DomainName=='$DOMAIN'].Id" --output text)
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"
